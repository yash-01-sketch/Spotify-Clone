    <div class="bottom">
        <input type="range" name="range" id="myProgressBar" min="0" value="0" max="100">
        <div class="icons">
            <button id="previous" style="font-size:24px; padding:10px; margin:10px;">⏮ Previous</button>
            <button id="masterPlay" style="font-size:24px; padding:10px; margin:10px;">▶ Play</button>
            <button id="next" style="font-size:24px; padding:10px; margin:10px;">Next ⏭</button>
        </div>
        <div class="volumeControl" style="margin-top: 10px;">
            <label for="volumeSlider">Volume: </label>
            <input type="range" id="volumeSlider" min="0" value="50" max="100" style="width: 200px; cursor: pointer;">
        </div>
        <div class="songInfo">
            <img src="playing.gif" width="42px" alt="" id="gif"> <span id="masterSongName">[NCS Release]</span>

    <audio id="audioPlayer"></audio>
